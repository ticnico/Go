name: Extract ok.zip

on:
  push:
    branches:
      - main
    paths:
      - ok.zip
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check ZIP
        run: |
          ls -lah
          test -f ok.zip

      - name: Extract ZIP
        run: |
          unzip -o ok.zip -d extracted
          cp -a extracted/. .
          rm -rf extracted
          rm -f ok.zip

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Extract ok.zip"
            git push
          fi
